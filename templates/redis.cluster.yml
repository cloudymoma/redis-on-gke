# Redis Cluster mode (sharded): clusterSize leaders + clusterSize followers.
# Scale shards with:  ./bin/redis.sh scale <n>   (the operator reshards slots)
# Placeholders (__X__) are rendered by bin/redis.sh deploy.
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: redis-cluster
spec:
  clusterSize: 3            # number of shards (leaders); followers match this count
  clusterVersion: v7
  persistenceEnabled: true
  redisConfig:
    # maxmemory = 60% of the container memory limit, leaving headroom for the
    # fork/copy-on-write spike during BGSAVE. Applied by the operator config
    # init container: requires the GenerateConfigInInitContainer feature gate
    # that bin/operator.sh enables. Eviction policy is left at the Redis
    # default (noeviction): writes fail with OOM at the limit instead of the
    # container being OOMKilled. Set the top-level key: the operator ignores
    # per-role redisLeader/redisFollower copies of it.
    maxMemoryPercentOfLimit: 60
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    redisSecret:
      name: __SECRET_NAME__
      key: password
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
  redisLeader:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    pdb:
      enabled: true
      maxUnavailable: 1
    affinity:
      podAntiAffinity:
        # Hard: no two cluster pods of either role on one node, so a leader
        # never shares a node with its own follower (follower-i replicates
        # leader-i) and a single drain cannot take a whole shard. Needs one
        # node per pod: 2 x clusterSize (bin/config.sh NUM_NODES=2 per zone).
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["redis-cluster-leader", "redis-cluster-follower"]
            topologyKey: kubernetes.io/hostname
        # Soft: spread leaders across zones.
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: redis-cluster-leader
              topologyKey: topology.kubernetes.io/zone
  redisFollower:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    pdb:
      enabled: true
      maxUnavailable: 1
    affinity:
      podAntiAffinity:
        # Hard: no two cluster pods of either role on one node, so a leader
        # never shares a node with its own follower (follower-i replicates
        # leader-i) and a single drain cannot take a whole shard. Needs one
        # node per pod: 2 x clusterSize (bin/config.sh NUM_NODES=2 per zone).
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["redis-cluster-leader", "redis-cluster-follower"]
            topologyKey: kubernetes.io/hostname
        # Soft: spread followers across zones.
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: redis-cluster-follower
              topologyKey: topology.kubernetes.io/zone
  storage:
    keepAfterDelete: true   # operator finalizer must not delete PVCs with the CR; redis.sh clean --purge does that explicitly
    volumeClaimTemplate:
      spec:
        storageClassName: redis-balanced-retain  # Hyperdisk Balanced for C4
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        storageClassName: redis-balanced-retain  # cluster node.conf
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi  # >= pd-balanced (10 GiB) and hyperdisk-balanced (4 GiB) minimums
