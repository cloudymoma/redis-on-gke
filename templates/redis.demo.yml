# Standalone Redis — single pod, for dev/PoC only (no HA, no sharding).
# Placeholders (__X__) are rendered by bin/redis.sh deploy.
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis-standalone
spec:
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    redisSecret:
      name: __SECRET_NAME__
      key: password
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
  storage:
    keepAfterDelete: true   # operator finalizer must not delete PVCs with the CR; redis.sh clean --purge does that explicitly
    volumeClaimTemplate:
      spec:
        storageClassName: hyperdisk-balanced  # Hyperdisk Balanced for C4
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi   # pd-balanced minimum (demo profile lands on E2 / pd-balanced)
