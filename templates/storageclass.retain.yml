# Same dynamic disk selection as storageclass.hyperdisk.yml, but with
# reclaimPolicy: Retain so deleting a PVC releases the disk instead of
# destroying it. Used by the production topologies (cluster, sentinel);
# the demo topology keeps the Delete class because disposability is the point.
# reclaimPolicy is immutable, hence a separate class rather than an edit.
# Released PVs must be reclaimed (or deleted) manually.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: redis-balanced-retain
provisioner: pd.csi.storage.gke.io
parameters:
  type: dynamic
  pd-type: pd-balanced
  hyperdisk-type: hyperdisk-balanced
  use-allowed-disk-topology: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
