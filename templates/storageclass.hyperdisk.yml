# StorageClass with dynamic disk selection:
# - Automatically provisions hyperdisk-balanced on C3/C4 nodes
# - Automatically falls back to pd-balanced on E2/N2 nodes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hyperdisk-balanced
provisioner: pd.csi.storage.gke.io
parameters:
  type: dynamic
  pd-type: pd-balanced
  hyperdisk-type: hyperdisk-balanced
  use-allowed-disk-topology: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
